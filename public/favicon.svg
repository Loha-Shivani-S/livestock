<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#0d131f" stroke="#1e293b" stroke-width="2" />

  <!-- Shield Shape -->
  <path d="M32 10 L48 16 C48 30 42 43 32 50 C22 43 16 30 16 16 Z" 
        fill="#111827" 
        stroke="url(#shieldGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round" />

  <!-- Radar / Wireless Beacon Waves -->
  <path d="M26 21 A8 8 0 0 1 38 21" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <path d="M29 24 A4 4 0 0 1 35 24" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />

  <!-- Livestock Head Crest Silhouette -->
  <!-- Horns & Ears -->
  <path d="M22 28 C23 23 27 24 30 27 M42 28 C41 23 37 24 34 27" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
  <!-- Muzzle shape -->
  <path d="M27 28 C27 35 29 38 32 38 C35 38 37 35 37 28 Z" fill="#1e293b" stroke="#94a3b8" stroke-width="1.2" />

  <!-- Heartbeat / Telemetry Pulse Line overlay -->
  <path d="M19 33 L25 33 L28 27 L32 39 L36 29 L39 34 L45 34" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Center Active Sensor Node Dot -->
  <circle cx="32" cy="39" r="1.8" fill="#fbbf24" />
</svg>
